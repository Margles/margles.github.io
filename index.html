<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wetboiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="wrap">
        <div class="brand">
          <a class="logo" href="/">wetboiz.com</a>
          <span class="tagline">it's reddit, but wetter</span>
        </div>

        <nav class="nav">
          <button class="navbtn" id="openLogin" type="button">log in</button>
          <button class="navbtn" id="openSignup" type="button">sign up</button>
        </nav>

      </div>
    </header>

<section class="subheader">
  <div class="wrap subheader-inner">
    <h1>News for boiz</h1>
    <a class="newpost" href="#" id="newPostBtn">+ New post</a>
  </div>
</section>


<section class="composer">
  <div class="wrap">
    <form id="postForm" class="composer-form is-hidden">
      <div class="row">
        <label class="lbl" for="postTitle">title</label>
        <input id="postTitle" name="title" type="text" maxlength="120" required />
      </div>

      <div class="row">
        <label class="lbl" for="postBody">text</label>
        <textarea id="postBody" name="body" rows="4" maxlength="2000" required></textarea>
      </div>

      <div class="composer-actions">
        <button type="submit">post</button>
        <button type="button" id="cancelPost">cancel</button>
      </div>
    </form>
  </div>
</section>

<main class="wrap">
  <section class="feed" id="feed"></section>
</main>

<div id="authModal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="modal-backdrop" data-close="true"></div>
  <div class="modal-box">
    <div class="modal-title" id="authTitle">auth</div>

    <form id="loginForm" class="authform is-hidden">
      <div class="row">
        <label class="lbl" for="loginEmail">email</label>
        <input id="loginEmail" type="email" autocomplete="email" required />
      </div>
      <div class="row">
        <label class="lbl" for="loginPass">password</label>
        <input id="loginPass" type="password" autocomplete="current-password" required />
      </div>
      <div class="composer-actions">
        <button type="submit">log in</button>
        <button type="button" id="authClose1">cancel</button>
      </div>
    </form>

    <form id="signupForm" class="authform is-hidden">
      <div class="row">
        <label class="lbl" for="signupEmail">email</label>
        <input id="signupEmail" type="email" autocomplete="email" required />
      </div>
      <div class="row">
        <label class="lbl" for="signupUser">username</label>
        <input id="signupUser" type="text" autocomplete="username" required />
      </div>
      <div class="row">
        <label class="lbl" for="signupPass">password</label>
        <input id="signupPass" type="password" autocomplete="new-password" required />
      </div>
      <div class="composer-actions">
        <button type="submit">sign up</button>
        <button type="button" id="authClose2">cancel</button>
      </div>
    </form>

    <form id="setUserForm" class="authform is-hidden">
      <p class="authnote">Pick a username to post.</p>
      <div class="row">
        <label class="lbl" for="setUserInput">username</label>
        <input id="setUserInput" type="text" autocomplete="username" required />
      </div>
      <div class="composer-actions">
        <button type="submit">set username</button>
        <button type="button" id="authClose3">cancel</button>
      </div>
    </form>

    <div class="authstatus">
      <span id="authStatusText">not logged in</span>
      <button id="logoutBtn" type="button" class="navbtn is-hidden">log out</button>
    </div>
  </div>
</div>


<div id="modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-backdrop" data-close="true"></div>
  <div class="modal-box">
    <div id="modalTitle" class="modal-title">report</div>
    <p class="modal-text">don't be a pussy</p>
    <button id="modalClose" class="modal-btn" type="button">ok</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
